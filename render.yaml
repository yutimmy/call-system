services:
  - type: web
    name: call-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22
      - key: DATA_FILE
        value: /var/data/store.json
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
